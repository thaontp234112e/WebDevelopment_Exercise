<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Submitted</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        h2 {
            color: #a03b52;
        }
        p {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h2>Submitted Information</h2>
    <script>
        // Lấy dữ liệu từ URL (GET)
        const params = new URLSearchParams(window.location.search);

        document.write("<p><b>Full name:</b> " + params.get("full_name") + "</p>");
        document.write("<p><b>Email:</b> " + params.get("email") + "</p>");
        document.write("<p><b>Send to:</b> " + params.get("department") + "</p>");
        document.write("<p><b>Title:</b> " + params.get("title") + "</p>");
        document.write("<p><b>Content:</b> " + params.get("content") + "</p>");
    </script>
</body>
</html>
