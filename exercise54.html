<html>
    <head>
        <title>Exercise54-Phuong Thao</title>
        <script>
            function calculate(op) {
                var a = parseFloat(document.getElementById("a").value);
                var b = parseFloat(document.getElementById("b").value);
                var c = parseFloat(document.getElementById("c").value);
                var result = 0;

                switch (op) {
                    case "MAX":
                        result = Math.max(a, b, c);
                        break;
                    case "MIN":
                        result = Math.min(a, b, c);
                        break;
                    case "SIN":
                        result = Math.sin(a * Math.PI / 180);
                        break;
                    case "COS":
                        result = Math.cos(a * Math.PI / 180);
                        break;
                    case "POW":
                        result = Math.pow(a, b);
                        break;
                }
                document.getElementById("result").innerText = result;
            }
        </script>
    </head>
    <body>
        <form name="math_function">
            <table border="1">
                <tr>
                    <td>a:</td>
                    <td><input type="text" id="a" value="30"/></td>
                </tr>
                <tr>
                    <td>b:</td>
                    <td><input type="text" id="b" value="45"/></td>
                </tr>
                <tr>
                    <td>c:</td>
                    <td><input type="text" id="c" value="90"/></td>
                </tr>
                <tr>
                    <td>Result:</td>
                    <td id="result"></td>
                </tr>
                <tr>
                    <td colspan="2">
                        <button type="button" onclick="calculate('MAX')">MAX</button>
                        <button type="button" onclick="calculate('MIN')">MIN</button>
                        <button type="button" onclick="calculate('SIN')">sin(a)</button>
                        <button type="button" onclick="calculate('COS')">Cos(a)</button>
                        <button type="button" onclick="calculate('POW')">a^b</button>
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
