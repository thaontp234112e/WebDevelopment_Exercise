<html>
    <head>
        <title>
            Exercise 51-Phuong Thao
        </title>
        <style>
                  body {
                background-color: teal; 
                color: white; 
                font-family: Arial, sans-serif;
            }

            h1 {
                color: white;
                text-align: center;
            }

            p {
                
                font-size: 16px;
            }

           

            input, select, button {
                background-color: white;
                color: black;
                border: 1px solid #ccc;
                border-radius: 3px;
                padding: 3px;
            }

            select {
                width: 220px;
            }

            button {
                margin: 5px;
                cursor: pointer;
            }

            .center {
                text-align: center;
            }
        </style>
    </head>
    <body>
        <p align="center">
            <img src="../exercise51/images/Logo.gif"/>
        </p>
        <h1>
            Newborn Registration
        </h1>
        <form>
            <p>
                <label for="date">
                    Date
                </label>
                <input type="text" name="date" id="date" placeholder="mm/dd/yy"/>
            </p>
            <p>
                <label>1) Infant's first name:</label>
                <input type="text" name="first_name" id="first_name"/>
                <label for="last_name">Last:</label>
                <input type="text" name="last_name" id="last_name"/>
            </p>
            <p>
                <label>2) Medical Record #</label>
                <input type="text" name="record" id="record"/>
            </p>
            <p>
                <label>3)Date of birth:</label>
                <input type="text" name="birthday" id="birthday" placeholder="mm/dd/yy"/>
            </p>
            <p>
                <label>4) Birht weight:</label>
                <input type="text" name="weight" id="weight"/>
            </p>
            <p>
                <label>5) APGAR score:</label>
                <input type="text" name="score" id="score"/>
            </p>
            <p>
                <label>6) Mother's first name:</label>
                <input type="text" name="m_first_name" id="m_first_name"/>
                <label for="last_name">Last:</label>
                <input type="text" name="m_last_name" id="m_last_name"/>
            </p>
            <p>
                <label>7) Father's first name:</label>
                <input type="text" name="f_first_name" id="f_first_name"/>
                <label for="last_name">Last:</label>
                <input type="text" name="f_last_name" id="f_last_name"/>
            </p>
            <p>
                8)Physician(check all that apply)
            </p>
            <p>
                <select name="physician" id="physician" size="4" multiple>
                    <option>Dr. Warren Albert</option>
                    <option>Dr. Maria Alvarez</option>
                    <option>Dr. Karen Brinkman</option>
                    <option>Dr. Micheal Kerry</option>
                </select>
            </p>
            <p>
                <button type="button">Register</button>
                <button type="reset">Cancel</button>
            </p>

        </form>
    </body>
</html>
